<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="icon" type="image/x-icon" href="images/logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #fff8dc;
    }
    .container-fluid {
      background-color: rgba(209, 112, 141, 0.186); /* Bootstrap warning color */
      max-width: 500px;
      width: 90%;
      margin: 80px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .login-box {
      background-color: #fff;
      width: 70%;
      margin: auto;
      padding: 20px;
      border-radius: 8px;
      
      
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="login-box">
      <h4 class="text-center mb-3">Login</h4>
      <form id="loginForm">
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Enter your email:</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="Enter your Email" >
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label" >Enter your Password:</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="Enter your Password" >
        </div>
        <button type="submit" class="btn btn-danger w-100">Login</button>
        <div id="message" class="mt-3 text-center fw-bold"></div>
        <div class="signup mt-1">
          <a href="register.html" class="ms-2" >Sign up</a>
          <!-- <a href="#" class="ms-3">Rest Password</a> -->
        </div>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
